spring:
  application:
    name: url-shortener-orchestrator
  datasource:
    # File-backed H2 so runs survive a restart - that matters for approval gates,
    # which are supposed to be able to wait. Swap the URL for Postgres in production.
    url: jdbc:h2:file:./data/shortener;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

shortener:
  # counter | hash - see ADR-001
  strategy: counter
  base-url: http://localhost:8080
  hash-salt: local-dev-salt
  code-secret: 8675309
  counter-block-size: 1000

orchestrator:
  # How many times a stage's primary agent may be attempted before the fallback agent
  # takes over. If the fallback also fails, the run is rolled back.
  max-attempts: 3
  # How many times a human may send one run back for re-planning.
  max-revisions: 3
  llm:
    # Off by default: every stage uses the deterministic stub, no key or network needed.
    # Turn on with ORCHESTRATOR_LLM_ENABLED=true and ANTHROPIC_API_KEY set.
    enabled: false
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-4-5
    max-tokens: 800
    timeout-seconds: 60

logging:
  level:
    com.schwab.shortener: INFO
